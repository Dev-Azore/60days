 $('#af').onsubmit=async ev=>{ev.preventDefault();const n=$('#nm').value.trim(),p=$('#p1').value,er=$('#er'),btn=ev.submitter;
  if(!slug(n))return er.textContent='Enter your real name.';
  if(!/^\d{4}$/.test(p))return er.textContent='PIN must be exactly 4 digits.';
  if(reg&&p!==$('#p2').value)return er.textContent='PINs do not match.';
  btn.disabled=true;er.textContent='';
  try{me=await(reg?B.register(n,p):B.login(n,p));enter()}catch(x){er.textContent=errMsg(x);btn.disabled=false}}
}
function enter(){
 tab='t';
 draw(`${B.live?'':'<div class="bn">Demo mode: data stays on this device. Add your Firebase config to share the leaderboard.</div>'}
 <header><div class="hb"><div class="brand">DevStreak <span>60</span></div><div class="who"><span>${e(me.name)}</span><button class="ib" id="lo">${svg('l')}<span>Sign out</span></button></div></div></header>
 <nav class="nav">${[['t','Today'],['r','Roadmap'],['b','Standings']].map(x=>`<button data-t="${x[0]}">${svg(x[0])}${x[1]}</button>`).join('')}</nav><main class="wrap" id="v"></main>`);
 $('#lo').onclick=async()=>{unwatch&&unwatch();await B.logout();me=null;members=[];mode='in';vAuth()};
 document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();scrollTo(0,0)});
 unwatch=B.watch(l=>{members=l;render()});
 render();
}
function render(){if(!me||!$('#v'))return;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));$('#v').innerHTML={t:vToday,r:vRoad,b:vBoard}[tab]()}
function ranked(){const L=members.filter(m=>m.id!==me.id).concat([{id:me.id,name:me.name,done:me.done}]).map(m=>({id:m.id,name:m.name||'Tutee',s:stats(m.done)})).sort((a,b)=>b.s.k-a.s.k||b.s.n-a.s.n||a.name.localeCompare(b.name));
 L.forEach((u,i)=>{const p=L[i-1];u.rk=p&&p.s.k===u.s.k&&p.s.n===u.s.n?p.rk:i+1});return L}
const nextDay=()=>{const s=new Set(me.done);for(let i=1;i<=60;i++)if(!s.has(i))return i;return 0};
const tags=d=>(CHK.includes(d)?'<span class="chip w">Checkpoint</span> ':'')+(REV.includes(d)?'<span class="chip">Review</span>':'');

function vToday(){
 const st=stats(me.done),L=ranked(),rk=L.find(x=>x.id===me.id).rk,nx=nextDay(),s=new Set(me.done);
 const seg=[0,1,2].map(i=>{let c=0;for(let d=i*20+1;d<=i*20+20;d++)if(s.has(d))c++;return`<i><u style="width:${c*5}%"></u></i>`}).join('');
 let hero;
 if(!nx)hero=`<div class="card"><h2 class="t">All 60 days complete 🎓</h2><p class="mu">You finished the full roadmap. Prepare your capstone defense and ship your final release.</p></div>`;
 else{const x=D[nx-1];hero=`<div class="card"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="chip">Up next · Day ${nx}</span>${tags(nx)}</div>
  <h2 class="t" style="margin:12px 0 0">${e(x[0])}</h2>
  <div class="kv"><b>Build</b><span>${e(x[1])}</span><b>Habit</b><span>${e(x[2])}</span></div>
  <button class="btn" data-day="${nx}">Log Day ${nx}</button></div>`}
 const cp=nx?P[ph(nx)]:P[2];
 return`<h2 class="t">${st.n?(st.k?pl(st.k,'day')+' strong. Keep going.':'Welcome back. Start a new streak today.'):'Your 60 days start here.'}</h2>${hero}
 <div class="stats"><div class="stat"><b>${st.k}</b><span>Day streak</span></div><div class="stat"><b>${st.n}<small class="mu" style="font-size:14px">/60</small></b><span>Completed</span></div><div class="stat"><b>#${rk}</b><span>of ${L.length}</span></div></div>
 <div class="card"><div style="display:flex;justify-content:space-between"><h3>Progress</h3><span class="mu sm">${Math.round(st.n/.6)/10}%</span></div><div class="seg">${seg}</div><div class="lg">${P.map(p=>`<span>${p.n}</span>`).join('')}</div></div>
 <div class="card"><span class="chip">Current rule · ${cp.n}</span><p style="margin-top:10px">${cp.r}</p></div>`;
}
function vRoad(){
 const s=new Set(me.done),cur=nextDay()?ph(nextDay()):2;
 return`<h2 class="t">Roadmap</h2>`+P.map((p,i)=>{let h='',c=0;
  for(let d=i*20+1;d<=i*20+20;d++){const x=D[d-1],dn=s.has(d);if(dn)c++;
   if((d-1)%10==0)h+=`<div class="sp">Sprint ${Math.ceil(d/10)}</div>`;
   h+=`<button class="row${dn?' d':''}" data-day="${d}"><span class="dn">${dn?'✓':d}</span><span class="tx"><b>${e(x[0])}</b><span>${e(x[1])}</span></span>${CHK.includes(d)?'<span class="chip w">Checkpoint</span>':REV.includes(d)?'<span class="chip">Review</span>':''}</button>`}
  return`<details${i===cur?' open':''}><summary><span><h3>Phase ${i+1}: ${p.n}</h3><span class="mu sm">${p.d}</span></span><span class="chip">${c}/20</span></summary><p class="rule">${p.r}</p>${h}</details>`}).join('');
}
function vBoard(){
 const L=ranked(),i=L.findIndex(x=>x.id===me.id),st=L[i].s;let m;
 if(L.length==1)m='You are first on the board. Invite your cohort and set the pace.';
 else if(!st.n)m='Complete Day 1 to start climbing the standings.';
 else if(i==0){const g=st.k-L[1].s.k;m=g>0?`You lead the cohort by ${pl(g,'day')}. Keep the chain unbroken.`:`You are level with ${e(L[1].name)} at the top. One more day takes the lead.`}
 else{const a=L[i-1],g=a.s.k-st.k;m=g>0?`Log ${pl(g+1,'day')} in a row to pass ${e(a.name)}.`:`Log your next day to move past ${e(a.name)}.`}
 const B2=[['First day',st.n>=1],['7-day streak',st.b>=7],['14-day streak',st.b>=14],['30-day streak',st.b>=30],['Full 60',st.n>=60]];
 const pod=L.length>=3?`<div class="pod">${[1,0,2].map(j=>{const u=L[j];return`<div class="pc${j==0?' f':''}"><div class="av">${e((u.name[0]||'?').toUpperCase())}</div><b>${e(u.name)}</b><div class="k">${u.s.k}<span class="mu sm"> d</span></div><span class="mu sm">#${u.rk}</span></div>`}).join('')}</div>`:'';
 return`<h2 class="t">Cohort standings</h2><div class="msg">${m}</div>${pod}
 <div class="card" style="padding:0;overflow:hidden">${L.map(u=>`<div class="lr${u.id===me.id?' me':''}"><span class="rk">${u.rk}</span><div class="av">${e((u.name[0]||'?').toUpperCase())}</div><div class="m"><b>${e(u.name)}${u.id===me.id?' <span class="chip">You</span>':''}</b><div class="pb"><u style="width:${u.s.n/.6}%"></u></div></div><div style="text-align:right"><div class="fl">${u.s.k?'🔥 ':''}${u.s.k}</div><div class="mu sm">${u.s.n}/60</div></div></div>`).join('')}</div>
 <p class="mu sm" style="margin:-4px 4px 14px">Ranked by current streak, then total days completed. Everyone in the cohort appears here.</p>
 <div class="card"><h3>Your milestones</h3><div class="bd">${B2.map(b=>`<span class="${b[1]?'on':''}">${b[1]?'✓ ':''}${b[0]}</span>`).join('')}</div></div>`;
}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-day]');if(b&&me)sheet(+b.dataset.day);if(ev.target.id==='sh')closeSheet()});
const closeSheet=()=>$('#sh').classList.remove('on');
function sheet(d){
 const x=D[d-1],dn=me.done.includes(d),lg=(me.logs||{})[d]||{};
 $('#sh').innerHTML=`<div class="sheet"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="chip">Day ${d}</span>${tags(d)}<span class="mu sm">Sprint ${Math.ceil(d/10)}</span></div>
 <h2 class="t" style="margin:10px 0 0">${e(x[0])}</h2><div class="kv"><b>Build</b><span>${e(x[1])}</span><b>Habit</b><span>${e(x[2])}</span></div>
 <label>What did you build or learn?<textarea id="nt" rows="3" maxlength="600">${e(lg.notes||'')}</textarea></label>
 <label>GitHub commit or PR link (optional)<input id="lnk" type="url" placeholder="https://github.com/…" value="${e(lg.link||'')}"></label>
 <button class="btn" id="sv">${dn?'Save changes':'Mark Day '+d+' complete'}</button>${dn?'<button class="btn g" id="un" style="margin-top:8px">Mark as not done</button>':''}<button class="btn g" id="cl" style="margin-top:8px;border:0">Close</button></div>`;
 $('#sh').classList.add('on');
 $('#cl').onclick=closeSheet;$('#sv').onclick=()=>save(d,true);if(dn)$('#un').onclick=()=>save(d,false);
}
async function save(d,done){
 const t=$('#nt').value.trim(),l=$('#lnk').value.trim();
 if(l&&!/^https?:\/\//i.test(l))return toast('Link must start with http:// or https://');
 const set=new Set(me.done);done?set.add(d):set.delete(d);const nd=[...set].sort((a,b)=>a-b);
 const logs={...(me.logs||{})};if(t||l)logs[d]={notes:t,link:l};else delete logs[d];
 document.querySelectorAll('#sh .btn').forEach(b=>b.disabled=true);
 try{await B.save(me.id,nd,logs);me.done=nd;me.logs=logs;closeSheet();render();toast(done?'Day '+d+' saved. Nice work.':'Day '+d+' marked as not done.')}
 catch(x){document.querySelectorAll('#sh .btn').forEach(b=>b.disabled=false);toast('Could not save. Please try again.')}
}
</script>
</body>
</html>
